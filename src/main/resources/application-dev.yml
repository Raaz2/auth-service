spring:
  application:
    name: authservice

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/authservice}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true